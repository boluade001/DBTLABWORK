models:
  - name: jaffleshop_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: jaffleshop_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - placed
                  - return_pending
                  - returned
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                field: customer_id
                to: ref('jaffleshop_customers')
          #go to https://hub.getdbt.com/ go to expectations for expanded tests.
          # for singular test, create sql in the test folder and write sql criteria for the test
          # 
          




